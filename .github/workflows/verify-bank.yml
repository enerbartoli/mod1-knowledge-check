name: verify-question-bank

# Drift guard. Fails the build (not just warns) whenever a rendered quiz page
# stops matching the canonical question bank. Runs on every push and PR, so a
# brand-new module is checked on its first commit — it is compared against the
# absolute canonical bank, never against the previous state.
#
# The path filters must name every quiz page file, or a new module's first commit
# skips CI entirely and the fail-closed design buys nothing. They cover both tracks:
# quiz.js + mod*.js/mod*.html (main programme) and speed*.js/speed*.html (Speed
# Training). Add the new pattern here whenever a track is added.

on:
  push:
    branches: ['**']
    paths:
      - 'quiz.js'
      - 'mod*.js'
      - 'speed*.js'
      - 'index.html'
      - 'mod*.html'
      - 'speed*.html'
      - 'modules.js'
      - 'dashboard-data.js'
      - 'backend/apps-script.gs'
      - 'KC_Canonical_QuestionBank_*.json'
      - 'audit/APP_INVENTORY.md'
      - 'tools/**'
      - '.github/workflows/verify-bank.yml'
  pull_request:
    paths:
      - 'quiz.js'
      - 'mod*.js'
      - 'speed*.js'
      - 'index.html'
      - 'mod*.html'
      - 'speed*.html'
      - 'modules.js'
      - 'dashboard-data.js'
      - 'backend/apps-script.gs'
      - 'KC_Canonical_QuestionBank_*.json'
      - 'audit/APP_INVENTORY.md'
      - 'tools/**'
      - '.github/workflows/verify-bank.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify rendered pages against canonical bank
        run: node tools/verify_bank.js
      - name: Verify app inventory is up to date
        run: node tools/verify_inventory.js
      - name: Verify module registry (menu + dashboard filters) matches the bank
        run: node tools/verify_registry.js
